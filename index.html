<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/portfoliofavicon.png" />
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #000000;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #attribution {
        position: fixed;
        bottom: 16px;
        left: 20px;
        font-family: 'Courier New', monospace;
        font-size: 11px;
        color: #636363;
        letter-spacing: 0.04em;
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="control-panel"></div>
    <div id="attribution">
      Procedurally generated · Topology consistent with SDSS large-scale structure surveys
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
